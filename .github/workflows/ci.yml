name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  contract:
    name: Contract unit + WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo test --lib
      - run: cargo build --target wasm32-unknown-unknown --release
      - name: Assert nearmyst.wasm
        run: test -f target/wasm32-unknown-unknown/release/nearmyst.wasm

  sandbox:
    name: Contract sandbox (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Build WASMs
        run: |
          cargo build --target wasm32-unknown-unknown --release
          cargo build --manifest-path mock_ft/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Sandbox tests
        run: cargo test --features sandbox --test sandbox -- --nocapture
